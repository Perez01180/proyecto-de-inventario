<head>

<body data-bs-theme="dark" class="bg-dark text-light">
    <nav class="navbar navbar-expand-md navbar-dark bg-dark border-bottom">
        <div class="container">

            <a href="/" class="navbar-brand">Pañol</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-navbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div id="main-navbar" class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a href="/" class="nav-link">Inicio</a>
                    </li>
                    <li class="nav-item nav-loading" id="login">
                        <a href="/login.html" class="nav-link">Iniciar sesión</a>
                    </li>
                    <li class="nav-item nav-loading" id="admin">
                        <a href="/administracion.html" class="nav-link">Admin</a>
                    </li>
                    <li class="nav-item" id="tools">
                        <a href="/herramientas.html" class="nav-link">Herramientas</a>
                    </li>
                    <li class="nav-item nav-loading" id="logOut">
                        <button class="nav-link">Cerrar sesión</button>
                    </li>

                </ul>
            </div>
        </div>
    </nav>
    <script>
        const token = localStorage.getItem("userToken");
        const role = localStorage.getItem("userRole");

        const navLogOut = document.getElementById("logOut");
        const navAdmin = document.getElementById("admin");
        const navLogin = document.getElementById("login");

        if (token) {
            navLogin.classList.add("ocultar-nav")
            navLogOut.classList.remove("nav-loading")
            if (role === "user") {
                navAdmin.classList.add("ocultar-nav")
            } else {
                navAdmin.classList.remove("nav-loading")
            }
        } else {
            navLogin.classList.remove("nav-loading")
            navLogOut.classList.add("ocultar-nav")
            navAdmin.classList.add("ocultar-nav")
        }
    </script>
    <main id="main-index" class="container py-3">
        <section class="text-center">

        </section>

        <div class="accordion" id="ordersList" data-bs-theme="dark">
            <div class="accordion-item mb-3 border-secondary shadow">
                <h2 class="accordion-header" id="heading10246">

                        data-bs-target="#pedido10246" aria-expanded="true" aria-controls="pedido10246">

                        <div class="d-flex gap-4 align-items-center w-100 pe-3 text-light-emphasis">
                            <p class="mb-0 text-light">Daniel Paz</p>
                            <p class="mb-0">-</p>
                            <p class="mb-0">Marcelo Rivera</p>
                            <p class="mb-0">-</p>
                            <p class="mb-0 text-info fw-semibold">pendiente</p>
                            <p class="mb-0">-</p>
                            <p class="mb-0">10/10/2026</p>
                        </div>
                    </button>
                </h2>

                <div id="pedido10246" class="accordion-collapse collapse" aria-labelledby="heading10246"

                                    <tr>
                                        <td class="ps-3 text-light">Pinzas</td>
                                        <td class="text-center text-muted">IsaacTool</td>
                                        <td class="text-end text-muted pe-3">8</td>

                        <div class="d-flex justify-content-between align-items-center pt-2">

</body>
