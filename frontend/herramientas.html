<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
</head>

<body data-bs-theme="dark" class="bg-dark text-light">
    <nav class="navbar navbar-expand-md navbar-dark bg-dark border-bottom">
        <div class="container">

            <a href="/" class="navbar-brand">Pañol</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-navbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div id="main-navbar" class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a href="/" class="nav-link">Inicio</a>
                    </li>
                    <li class="nav-item nav-loading" id="login">
                        <a href="/login.html" class="nav-link">Iniciar sesión</a>
                    </li>
                    <li class="nav-item nav-loading" id="admin">
                        <a href="/administracion.html" class="nav-link">Admin</a>
                    </li>
                    <li class="nav-item" id="tools">
                        <a href="/herramientas.html" class="nav-link">Herramientas</a>
                    </li>
                    <li class="nav-item nav-loading" id="logOut">
                        <button class="nav-link">Cerrar sesión</button>
                    </li>

                </ul>
            </div>
        </div>
    </nav>
    <script>
        const token = localStorage.getItem("userToken");
        const role = localStorage.getItem("userRole");

        const navLogOut = document.getElementById("logOut");
        const navAdmin = document.getElementById("admin");
        const navLogin = document.getElementById("login");

        if (token) {
            navLogin.classList.add("ocultar-nav")
            navLogOut.classList.remove("nav-loading")
            if (role === "user") {
                navAdmin.classList.add("ocultar-nav")
            } else {
                navAdmin.classList.remove("nav-loading")
            }
        } else {
            navLogin.classList.remove("nav-loading")
            navLogOut.classList.add("ocultar-nav")
            navAdmin.classList.add("ocultar-nav")
        }
    </script>
    <main class="container py-3">
        <h1 class="mb-4">Lista de Herramientas</h1>
        <p class="text-secondary mb-4">Desde esta sección se pueden consultar las herramientas registradas</p>
        
        <div class="d-flex justify-content-end mb-3" id = "buttonNewTool">
            <button id="buttonAddTool" class="btn btn-outline-light d-flex align-items-center gap-2" type="button">
                <a class="nav-link">Nueva Herramienta</a>
            </button>
        </div>
        
        <div class="table-responsive">
            <table class="table table-dark table-striped table-hover">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Estado</th>
                        <th>Disponibilidad</th>
                        <th>Cantidad</th>
                        <th>Marca</th>
                        <th>Sección</th>
                        <th>Serialización</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id = "toolsList">
                    <tr>
                        <td colspan="7" class="text-center">Cargando Herramientas</td>
                    </tr>
                </tbody>
                <table>
        </div>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/navbar.js" type="module"></script>
    <script src="js/herramientas.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
</body>

</html>
